name: Offline renewal regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/requirements.txt
      - run: bash -n pihole-easy-acme.sh
      - run: bash -n monitoring/zabbix/openclaw-zbx-pihole-easy-acme
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
